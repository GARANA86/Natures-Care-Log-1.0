<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#1f6f43" />
<title>Plant Care Log</title>
<style>
  :root{
    --bg:#f4f7f4; --card:#ffffff; --ink:#183126; --muted:#6d7c74;
    --green:#1f6f43; --green2:#e4f2e9; --gold:#b87917; --red:#a33a3a;
    --border:#dfe8e2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:760px;margin:auto;padding:18px 14px 90px}
  h1{font-size:28px;margin:8px 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.04)}
  .row{display:flex;gap:10px;align-items:center}
  input,button{font:inherit}
  input{flex:1;padding:13px 14px;border:1px solid #ccd8d0;border-radius:12px;background:#fff;min-width:0}
  button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
  .primary{background:var(--green);color:white}
  .water{background:#e4f1ff;color:#1b5f9e}
  .fert{background:#fff0d8;color:#8b5a0d}
  .ghost{background:#eef2ef;color:#33453b}
  .danger{background:#fde8e8;color:var(--red)}
  .plant-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .plant-name{font-weight:800;font-size:19px}
  .meta{color:var(--muted);font-size:14px;margin-top:4px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .history{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}
  .event{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}
  .event span:last-child{color:var(--muted);text-align:right}
  .empty{text-align:center;color:var(--muted);padding:22px 8px}
  .toptools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .small{font-size:13px;padding:9px 11px}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
  @media(max-width:520px){.wrap{padding-top:10px}.actions{grid-template-columns:1fr 1fr}.row.add{flex-direction:column}.row.add input,.row.add button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌿 Plant Care Log</h1>
  <p class="sub">Track when you water and fertilize each plant.</p>

  <div class="card">
    <div class="row add">
      <input id="plantName" placeholder="Plant name (example: Fukien Tea)" maxlength="60" />
      <button class="primary" onclick="addPlant()">Add Plant</button>
    </div>
  </div>

  <div class="toptools">
    <button class="ghost small" onclick="exportData()">Export Backup</button>
    <label class="ghost small" style="display:inline-flex;align-items:center;cursor:pointer">
      Import Backup
      <input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)">
    </label>
  </div>

  <div id="plants"></div>

  <footer>Saved locally on this device. Export a backup before clearing Safari data or changing phones.</footer>
</div>

<script>
const KEY='plantCareLog_v1';
let plants = load();

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch(e){ return []; }
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(plants));
  render();
}
function fmt(iso){
  const d=new Date(iso);
  return d.toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
}
function lastOf(p,type){
  const e=p.events.find(x=>x.type===type);
  return e ? fmt(e.at) : 'Never';
}
function addPlant(){
  const input=document.getElementById('plantName');
  const name=input.value.trim();
  if(!name) return;
  plants.unshift({id:crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),name,events:[]});
  input.value='';
  save();
}
function logEvent(id,type){
  const p=plants.find(x=>x.id===id);
  if(!p) return;
  p.events.unshift({type,at:new Date().toISOString()});
  save();
}
function removePlant(id){
  const p=plants.find(x=>x.id===id);
  if(!p) return;
  if(confirm(`Delete ${p.name} and all its history?`)){
    plants=plants.filter(x=>x.id!==id);
    save();
  }
}
function removeEvent(pid,index){
  const p=plants.find(x=>x.id===pid);
  if(!p) return;
  p.events.splice(index,1);
  save();
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(){
  const el=document.getElementById('plants');
  if(!plants.length){
    el.innerHTML='<div class="card empty">No plants yet. Add your first plant above.</div>';
    return;
  }
  el.innerHTML=plants.map(p=>`
    <div class="card">
      <div class="plant-head">
        <div>
          <div class="plant-name">${escapeHtml(p.name)}</div>
          <div class="meta">Last watered: ${lastOf(p,'Watered')}</div>
          <div class="meta">Last fertilized: ${lastOf(p,'Fertilized')}</div>
        </div>
        <button class="danger small" onclick="removePlant('${p.id}')">Delete</button>
      </div>

      <div class="actions">
        <button class="water" onclick="logEvent('${p.id}','Watered')">💧 Watered</button>
        <button class="fert" onclick="logEvent('${p.id}','Fertilized')">🌱 Fertilized</button>
      </div>

      <div class="history">
        ${p.events.length ? p.events.slice(0,20).map((e,i)=>`
          <div class="event">
            <span>${e.type==='Watered'?'💧':'🌱'} ${e.type}</span>
            <span>${fmt(e.at)} &nbsp; <button class="ghost small" onclick="removeEvent('${p.id}',${i})">Undo</button></span>
          </div>`).join('') : '<div class="meta">No care logged yet.</div>'}
      </div>
    </div>
  `).join('');
}
function exportData(){
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),plants},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='plant-care-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(ev){
  const file=ev.target.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const incoming=Array.isArray(data)?data:data.plants;
      if(!Array.isArray(incoming)) throw new Error();
      if(confirm('Replace the current plant list with this backup?')){
        plants=incoming;
        save();
      }
    }catch(e){ alert('That backup file could not be read.'); }
    ev.target.value='';
  };
  r.readAsText(file);
}
document.getElementById('plantName').addEventListener('keydown',e=>{if(e.key==='Enter')addPlant()});
render();
</script>
</body>
</html>
